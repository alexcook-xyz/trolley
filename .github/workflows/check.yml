name: check

on:
  push:
  pull_request:

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run project check
        run: npm run check
      # Add one VM smoke test for each OS when Proof B exists.
      # Keep that test in this job. Do not add a second workflow for it.
